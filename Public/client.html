<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة العميل - نظام إدارة المحامين</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .client-dashboard {
            display: none;
        }
        .login-form {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .consultation-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            background: white;
        }
        .consultation-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        .status-accepted {
            background: #d4edda;
            color: #155724;
        }
        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <!-- صفحة تسجيل الدخول -->
    <div id="loginPage">
        <div class="login-form">
            <h2 style="text-align: center; margin-bottom: 30px; color: #1a237e;">👤 تسجيل دخول العميل</h2>
            
            <div class="tab-buttons">
                <button class="tab-button active" onclick="showLoginTab()">تسجيل الدخول</button>
                <button class="tab-button" onclick="showRegisterTab()">تسجيل جديد</button>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <div id="loginForm">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="أدخل بريدك الإلكتروني">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="أدخل كلمة المرور">
                </div>
                <button class="btn btn-primary" style="width: 100%;" onclick="loginClient()">تسجيل الدخول</button>
                <div id="loginMessage" style="margin-top: 15px; text-align: center;"></div>
            </div>

            <!-- نموذج التسجيل -->
            <div id="registerForm" class="hidden">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="regFullName" class="form-control" placeholder="أدخل اسمك الكامل">
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="أدخل بريدك الإلكتروني">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" id="regPhone" class="form-control" placeholder="أدخل رقم الهاتف">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="أدخل كلمة المرور">
                </div>
                <div class="form-group">
                    <label>تأكيد كلمة المرور</label>
                    <input type="password" id="regConfirmPassword" class="form-control" placeholder="أعد إدخال كلمة المرور">
                </div>
                <button class="btn btn-success" style="width: 100%;" onclick="registerClient()">تسجيل</button>
                <div id="registerMessage" style="margin-top: 15px; text-align: center;"></div>
            </div>
        </div>
    </div>

    <!-- لوحة تحكم العميل -->
    <div id="clientDashboard" class="client-dashboard">
        <div class="container">
            <!-- الشريط الجانبي -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h3>👤 لوحة العميل</h3>
                    <p id="clientName" style="color: #ffd700;"></p>
                </div>
                <div class="sidebar-menu">
                    <a href="#dashboard" class="menu-item active" onclick="showSection('dashboard')">
                        <span>📊</span> لوحة التحكم
                    </a>
                    <a href="#consultations" class="menu-item" onclick="showSection('consultations')">
                        <span>📋</span> الاستشارات
                    </a>
                    <a href="#messages" class="menu-item" onclick="showSection('messages')">
                        <span>💬</span> الرسائل
                    </a>
                    <a href="#files" class="menu-item" onclick="showSection('files')">
                        <span>📎</span> الملفات
                    </a>
                    <a href="#camera" class="menu-item" onclick="showSection('camera')">
                        <span>📷</span> الكاميرا
                    </a>
                    <a href="#" class="menu-item" onclick="logout()">
                        <span>🚪</span> تسجيل الخروج
                    </a>
                </div>
            </div>

            <!-- المحتوى الرئيسي -->
            <div class="main-content">
                <!-- الرأس -->
                <div class="header">
                    <div class="header-left">
                        <button class="btn btn-sm" onclick="toggleSidebar()">☰</button>
                        <h2 id="sectionTitle">لوحة التحكم</h2>
                    </div>
                    <div class="header-right">
                        <div class="user-avatar" id="userAvatar"></div>
                    </div>
                </div>

                <!-- قسم لوحة التحكم -->
                <div id="dashboardSection" class="section">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-number" id="totalConsultations">0</div>
                            <div class="stat-label">الاستشارات</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number" id="pendingConsultations">0</div>
                            <div class="stat-label">قيد المراجعة</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number" id="totalCases">0</div>
                            <div class="stat-label">القضايا</div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">طلب استشارة جديدة</h3>
                        </div>
                        <div class="form-group">
                            <label>نوع الاستشارة</label>
                            <select id="consultationType" class="form-control">
                                <option value="مدني">قانون مدني</option>
                                <option value="جزائي">قانون جزائي</option>
                                <option value="تجاري">قانون تجاري</option>
                                <option value="أحوال شخصية">أحوال شخصية</option>
                                <option value="عمالي">قانون عمالي</option>
                                <option value="عقاري">قانون عقاري</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>موضوع الاستشارة</label>
                            <input type="text" id="consultationSubject" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>وصف الاستشارة</label>
                            <textarea id="consultationDescription" class="form-control" rows="4"></textarea>
                        </div>
                        <button class="btn btn-primary" onclick="submitConsultation()">إرسال الاستشارة</button>
                    </div>
                </div>

                <!-- قسم الاستشارات -->
                <div id="consultationsSection" class="section hidden">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">استشاراتي</h3>
                        </div>
                        <div id="consultationsList"></div>
                    </div>
                </div>

                <!-- قسم الرسائل -->
                <div id="messagesSection" class="section hidden">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">الدردشة مع المحامي</h3>
                        </div>
                        <div class="chat-container">
                            <div class="chat-messages" id="chatMessages"></div>
                            <div class="chat-input">
                                <input type="text" id="messageInput" placeholder="اكتب رسالتك..." onkeypress="handleMessageKeyPress(event)">
                                <button class="btn btn-primary" onclick="sendMessage()">إرسال</button>
                                <button class="btn btn-success" onclick="openCamera()">📷</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- قسم الملفات -->
                <div id="filesSection" class="section hidden">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">الملفات المشتركة</h3>
                        </div>
                        <div id="filesList"></div>
                    </div>
                </div>

                <!-- قسم الكاميرا -->
                <div id="cameraSection" class="section hidden">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">تصوير المستندات</h3>
                        </div>
                        <div style="text-align: center;">
                            <video id="cameraPreview" autoplay playsinline></video>
                            <br>
                            <button class="btn btn-primary" onclick="capturePhoto()">📸 التقاط صورة</button>
                            <button class="btn btn-danger" onclick="stopCamera()">إيقاف الكاميرا</button>
                        </div>
                        <canvas id="photoCanvas" style="display: none;"></canvas>
                        <div id="capturedPhotos"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال الكاميرا -->
    <div id="cameraModal" class="camera-modal">
        <div class="camera-container">
            <h3>تصوير مستند</h3>
            <video id="modalCameraPreview" autoplay playsinline></video>
            <br>
            <button class="btn btn-primary" onclick="captureFromModal()">📸 التقاط</button>
            <button class="btn btn-danger" onclick="closeCameraModal()">إغلاق</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/client.js"></script>
</body>
</html>
